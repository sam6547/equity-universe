name: Refresh data

# Reports the most recent trading day's close (weekends and NYSE holidays are skipped).
# A day counts as final from 6 pm New York time, so the evening run normally publishes it
# the same night; the overnight and morning runs are retries. Whichever run gets there
# first does the refresh (about 15 minutes); the rest just record that the job is alive.
# GitHub's scheduler is best effort: at busy times it starts runs late or skips them
# altogether (on 18 Nov 2026 all three morning runs were skipped), so there are eight
# chances a night, all off the hour, and at least five before the 9:30 open.
# Times are UTC; in New York they are 5 hours earlier in winter (EST), 4 in summer (EDT).
on:
  schedule:
    - cron: "37 23 * * *"   # 6:37 pm EST / 7:37 pm EDT   main run, the evening of the close
    - cron: "47 1 * * *"    # 8:47 pm EST / 9:47 pm EDT
    - cron: "7 4 * * *"     # 11:07 pm EST / 12:07 am EDT
    - cron: "27 7 * * *"    # 2:27 am EST / 3:27 am EDT
    - cron: "17 10 * * *"   # 5:17 am EST / 6:17 am EDT
    - cron: "17 11 * * *"   # 6:17 am EST / 7:17 am EDT
    - cron: "17 12 * * *"   # 7:17 am EST / 8:17 am EDT
    - cron: "7 13 * * *"    # 8:07 am EST / 9:07 am EDT   last chance before the open
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch everything for the latest trading day (normally only missing pieces are fetched)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/**"
      - "pipeline/**"
      - "tests/**"
      - "universe.csv"
      - "overrides.csv"
      - "manual/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write    # commit the refreshed data files
  pages: write       # publish the dashboard
  id-token: write    # required by the Pages deployment
  issues: write      # open / close the "refresh needs attention" issue

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      # Check out the branch as it is when this job starts. (By default a run that waited in the
      # queue would start from the commit that was current when it was queued, and then collide
      # with the data saved by the run ahead of it.)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No packages to install: the job uses only Python's standard library.
      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Fetch data
        run: python -m pipeline.run ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Record a failure that happened outside the fetch
        if: failure()
        run: python -m pipeline.report --record-failure "a step failed before or during the fetch - see the run log"

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: $(python -m pipeline.report --commit-message)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected: the branch moved while this job was running (attempt ${attempt})."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              # The data files were changed by someone else too. Machine-written files cannot be
              # merged, so drop this run's copy and publish what is saved on the branch instead.
              git rebase --abort
              git reset --hard "origin/${GITHUB_REF_NAME}"
              echo "::error::This run's data could not be saved because the data files changed underneath it. The saved data is published instead; the next run will fetch again."
              exit 1
            fi
          done
          echo "::error::Could not push the data commit after three attempts."
          exit 1

      # Never publish damaged files: if anything is unreadable, leave the site as it was.
      - name: Check the data files are intact
        if: always()
        id: validate
        run: python -m pipeline.report --validate-site

      - name: Package the dashboard
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish to GitHub Pages
        if: always() && steps.validate.outcome == 'success'
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # GitHub sometimes cannot see the package for a few seconds after it is uploaded.
      - name: Pause before a second publish attempt
        if: always() && steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Publish to GitHub Pages (second attempt)
        if: always() && steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v5

      # Opens (or updates, or closes) an issue so someone is told, and marks this run failed
      # when the refresh itself failed - GitHub then emails the repository owner.
      - name: Report health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.report --issue
